[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kifs"
version = "2.0.0"
description = "Shogi Wars KIF collection pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "orjson>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# tinydb is a test-only dependency: it verifies that `kifs export` still
# produces a file the old tooling can open.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "tinydb>=4.8"]

[project.scripts]
kifs = "kifs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
